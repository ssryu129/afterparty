<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>류성식 ❤ 현민희 After Party</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --cream: #f5f0e8; --gold: #b89a6a; --dark: #2c2418; --muted: #7a6e62; }
  body { background: var(--cream); color: var(--dark); font-family: 'Noto Serif KR', serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; }
  .wrap { max-width: 380px; width: 100%; text-align: center; animation: fadeUp 1s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .hline { border: none; border-top: 1px solid #ddd5c5; margin: 0 0 2rem; }
  .info { font-size: 13px; font-weight: 300; line-height: 2.6; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 2rem; }
  .info strong { display: block; font-size: 16px; font-weight: 400; color: var(--dark); letter-spacing: 0.1em; margin-bottom: 0.2rem; }
  .btn-wrap { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1rem; }
  .btn { display: block; width: 100%; padding: 13px; font-family: 'Noto Serif KR', serif; font-size: 13px; font-weight: 300; letter-spacing: 0.12em; cursor: pointer; border: none; transition: opacity 0.2s, transform 0.15s; text-decoration: none; }
  .btn:active { transform: scale(0.98); opacity: 0.85; }
  .btn-primary { background: var(--dark); color: var(--cream); }
  .btn-secondary { background: transparent; color: var(--dark); border: 1px solid #d0c8bc; }
  #result { font-size: 12px; color: var(--gold); min-height: 18px; letter-spacing: 0.05em; margin-top: 0.5rem; }
  .bgm-btn { background: none; border: none; cursor: pointer; color: var(--gold); font-size: 11px; letter-spacing: 0.12em; font-family: 'Cormorant Garamond', serif; font-style: italic; opacity: 0.7; margin-top: 2rem; display: block; width: 100vw; margin-left: calc(-50vw + 50%); padding: 1rem 0; transition: opacity 0.2s; }
  .bgm-btn:hover { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <p style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:22px; color:var(--muted); letter-spacing:0.18em; margin-bottom:1.5rem;">ryuniverse ✦ miniverse</p>
  <p style="font-size:22px; font-weight:400; letter-spacing:0.1em; margin-bottom:1.5rem;">류성식<span style="color:var(--gold); margin:0 0.4rem;">❤</span>현민희</p>
  <p style="font-family:'Cormorant Garamond',serif; font-style:italic; font-size:13px; color:var(--gold); letter-spacing:0.15em; margin-bottom:3rem;">Seongshick Ryu &amp; Minhee Hyun</p>

  <hr class="hline">

  <div class="info">
    <strong>After Party</strong>
    2027년 1월 16일 토요일<br>
    오후 5시 30분 — 미정
    <div style="margin-top:0.8rem;">
      <strong>신촌 어딘가</strong>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn btn-primary" onclick="addAfterParty()">📅 After Party 일정 저장</button>
    <a class="btn btn-secondary" href="https://map.naver.com/v5/search/신촌역" target="_blank">📍 오시는 길</a>
  </div>

  <div id="result"></div>

  <audio id="bgm" src="bgm.mp3" loop></audio>
  <button class="bgm-btn" id="bgmBtn" onclick="toggleBGM()">♪ 음악 정지</button>

</div>

<script>
function toggleBGM() {
  const audio = document.getElementById('bgm');
  const btn = document.getElementById('bgmBtn');
  if (audio.paused) { audio.play(); btn.textContent = '♪ 음악 정지'; }
  else { audio.pause(); btn.textContent = '♪ 음악 재생'; }
}
function startBGM() {
  const audio = document.getElementById('bgm');
  if (audio.paused) { audio.play().then(() => { document.getElementById('bgmBtn').textContent = '♪ 음악 정지'; }).catch(() => {}); }
  document.removeEventListener('click', startBGM);
  document.removeEventListener('touchstart', startBGM);
}
document.addEventListener('click', startBGM);
document.addEventListener('touchstart', startBGM);

function isIOS() { return /iP(hone|ad|od)/.test(navigator.userAgent); }
function isSafari() { return /^((?!chrome|android).)*safari/i.test(navigator.userAgent); }
function addAfterParty() {
  const result = document.getElementById('result');
  if (isIOS() && isSafari()) {
    const ics = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
      'DTSTART;TZID=Asia/Seoul:20270116T173000',
      'DTEND;TZID=Asia/Seoul:20270116T213000',
      'SUMMARY:류성식 ❤ 현민희 After Party',
      'LOCATION:신촌',
      'END:VEVENT', 'END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'afterparty.ics'; a.click();
    URL.revokeObjectURL(url);
    result.textContent = '캘린더 파일을 열어 저장하세요.';
  } else {
    const params = new URLSearchParams({ action: 'TEMPLATE', text: '류성식 ❤ 현민희 After Party', dates: '20270116T083000Z/20270116T123000Z', location: '신촌' });
    window.open('https://calendar.google.com/calendar/render?' + params, '_blank');
    result.textContent = 'After Party Google 캘린더가 열립니다.';
  }
}
</script>
</body>
</html>
